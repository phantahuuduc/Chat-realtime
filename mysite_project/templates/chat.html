{% load static %}<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CR7 Glory Chat</title>
<meta name="description" content="Real-time chat — UEFA Champions League Final, Moscow 2008.">
<link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/tokens.css' %}?v={{ asset_version }}">
<link rel="stylesheet" href="{% static 'css/base.css' %}?v={{ asset_version }}">
<link rel="stylesheet" href="{% static 'css/atmosphere.css' %}?v={{ asset_version }}">
<link rel="stylesheet" href="{% static 'css/components.css' %}?v={{ asset_version }}">
</head>
<body>

{% include "icons.svg" %}

<!-- ================= NỀN 4 TẦNG ================= -->
<div class="atmos" id="atmos">
  <div class="atmos__image" id="atmosImage" aria-hidden="true"></div>
  <div class="atmos__image atmos__image--next" id="atmosImageNext" aria-hidden="true"></div>
  <video class="atmos__video" id="atmosVideo" aria-hidden="true"
         src="{% static 'video/rain-loop.mp4' %}"
         poster="{% static 'img/rain-poster.jpg' %}"
         autoplay muted loop playsinline preload="auto"></video>
  <canvas class="atmos__canvas" id="atmosCanvas" aria-hidden="true"></canvas>
  <div class="atmos__scrim" aria-hidden="true"></div>
</div>

<!-- ================= ĐĂNG NHẬP ================= -->
<div class="auth" id="authScreen">
  <div class="auth__card">
    <div class="brand rise">
      <svg class="icon icon--lg brand__mark"><use href="#icon-logo"></use></svg>
      <div class="brand__body">
        <div class="brand__name display-text display-text--star"
             data-text="CR7 Glory Chat">CR7 Glory Chat</div>
        <div class="brand__eyebrow">Moscow 2008</div>
      </div>
    </div>

    <div class="auth__tabs rise" role="tablist">
      <button type="button" class="auth__tab" role="tab" aria-selected="true" data-tab="login">Đăng nhập</button>
      <button type="button" class="auth__tab" role="tab" aria-selected="false" data-tab="register">Đăng ký</button>
    </div>

    <div class="auth__error" id="authError" hidden>
      <svg class="icon icon--sm"><use href="#icon-alert"></use></svg>
      <span id="authErrorText"></span>
    </div>

    <form id="loginForm" class="rise" autocomplete="on">
      <label class="field">
        <span class="field__label">Tên đăng nhập</span>
        <input type="text" class="field__input" id="loginUser" required autocomplete="username">
      </label>
      <label class="field">
        <span class="field__label">Mật khẩu</span>
        <input type="password" class="field__input" id="loginPass" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn--primary auth__submit">Vào phòng</button>
    </form>

    <form id="registerForm" hidden autocomplete="on">
      <label class="field">
        <span class="field__label">Tên đăng nhập</span>
        <input type="text" class="field__input" id="regUser" required minlength="3" autocomplete="username">
      </label>
      <label class="field">
        <span class="field__label">Mật khẩu</span>
        <input type="password" class="field__input" id="regPass" required minlength="6" autocomplete="new-password">
      </label>
      <button type="submit" class="btn btn--primary auth__submit">Tạo tài khoản</button>
    </form>
  </div>
</div>

<!-- ================= ỨNG DỤNG ================= -->
<div class="app-shell" id="app" hidden>

  <aside class="sidebar">
    <div class="sidebar__top rise">
      <div class="brand">
        <svg class="icon icon--lg brand__mark"><use href="#icon-logo"></use></svg>
        <div class="brand__body">
          <div class="brand__name brand__name--sm display-text display-text--star"
               data-text="CR7 Glory Chat">CR7 Glory Chat</div>
          <div class="brand__eyebrow">Moscow 2008</div>
        </div>
      </div>
      <div class="sidebar__actions">
        <button class="btn-icon" id="btnPublicRooms" title="Phòng công khai">
          <svg class="icon"><use href="#icon-globe"></use></svg>
        </button>
        <button class="btn-icon" id="btnJoinCode" title="Tham gia bằng mã">
          <svg class="icon"><use href="#icon-key"></use></svg>
        </button>
        <button class="btn-icon" id="btnCreateRoom" title="Tạo phòng mới">
          <svg class="icon"><use href="#icon-plus"></use></svg>
        </button>
      </div>
    </div>

    <div class="sidebar__search rise">
      <svg class="icon icon--sm sidebar__search-icon"><use href="#icon-search"></use></svg>
      <input type="search" class="sidebar__search-input" id="roomFilter"
             placeholder="Lọc phòng (Ctrl+K)" autocomplete="off">
    </div>

    <div class="sidebar__list rise" id="roomList"></div>

    <div class="sidebar__user">
      <span class="avatar avatar--sm" id="meAvatar"></span>
      <div class="sidebar__user-body">
        <div class="sidebar__user-name" id="meName"></div>
        <div class="sidebar__user-state">
          <span class="presence-dot" data-state="online"></span>
          <span>Trực tuyến</span>
        </div>
      </div>
      <button class="btn-icon" id="btnTheme" title="Đổi hình nền">
        <svg class="icon"><use href="#icon-palette"></use></svg>
      </button>
      <button class="btn-icon" id="btnShortcuts" title="Phím tắt (?)">
        <svg class="icon"><use href="#icon-keyboard"></use></svg>
      </button>
      <button class="btn-icon" id="btnLogout" title="Đăng xuất">
        <svg class="icon"><use href="#icon-logout"></use></svg>
      </button>
    </div>
  </aside>

  <main class="stage">
    <header class="room-header" id="roomHeader" hidden>
      <span class="avatar room-header__avatar" id="roomAvatar"></span>
      <div class="room-header__body">
        <h1 class="room-header__title display-text">
          <span class="room-header__name display-text--star" id="roomName"></span>
          <span class="conn-dot" id="connDot" data-state="connecting" title="Đang kết nối"></span>
        </h1>
        <div class="room-header__meta">
          <span class="tag" id="roomVisibility">Riêng tư</span>
          <span class="tag" id="roomCode"></span>
          <span id="roomMemberCount"></span>
        </div>
      </div>
      <div class="room-header__actions">
        <button class="btn-icon" id="btnSearchPanel" title="Tìm trong phòng">
          <svg class="icon"><use href="#icon-search"></use></svg>
        </button>
        <button class="btn-icon" id="btnMemberPanel" title="Thành viên">
          <svg class="icon"><use href="#icon-members"></use></svg>
        </button>
        <button class="btn-icon" id="btnLeaveRoom" title="Rời phòng">
          <svg class="icon"><use href="#icon-close"></use></svg>
        </button>
      </div>
    </header>

    <div class="pin-bar" id="pinBar" hidden>
      <svg class="icon icon--sm pin-bar__icon"><use href="#icon-pin"></use></svg>
      <button type="button" class="pin-bar__text" id="pinBarText"></button>
      <span class="pin-bar__count" id="pinBarCount"></span>
      <button class="btn-icon" id="pinBarNext" title="Tin ghim tiếp theo" hidden>
        <svg class="icon icon--sm"><use href="#icon-chevron-down"></use></svg>
      </button>
    </div>

    <div class="empty-state" id="emptyState">
      <div class="empty-state__title display-text display-text--float rise">
        Chưa có phòng nào đang mở.
      </div>
      <div class="empty-state__sub rise">
        Chọn một phòng ở cột trái, hoặc mở phòng mới để bắt đầu.
      </div>
      <div class="empty-state__actions rise">
        <button class="btn-text" id="emptyCreate">Tạo phòng mới</button>
        <button class="btn-text" id="emptyJoin">Tham gia bằng mã</button>
      </div>
    </div>

    <div class="message-list" id="messageList" hidden></div>

    <button class="scroll-down" id="scrollDown">
      <svg class="icon icon--sm"><use href="#icon-arrow-down"></use></svg>
      <span id="scrollDownCount"></span>
    </button>

    <div class="composer" id="composer" hidden>
      <div class="typing-line" id="typingLine"></div>

      <div class="reply-preview" id="replyPreview" hidden>
        <svg class="icon icon--sm"><use href="#icon-reply"></use></svg>
        <span class="reply-preview__text" id="replyPreviewText"></span>
        <button class="btn-icon" id="replyCancel" title="Bỏ trích dẫn">
          <svg class="icon icon--sm"><use href="#icon-close"></use></svg>
        </button>
      </div>

      <div class="composer__box">
        <button class="btn-icon" id="btnEmoji" title="Chèn emoji">
          <svg class="icon"><use href="#icon-emoji"></use></svg>
        </button>
        <textarea class="composer__input" id="msgInput" rows="1" placeholder="Nhắn gì đó…"></textarea>
        <span class="composer__counter" id="charCounter" hidden></span>
        <button class="composer__send" id="btnSend" title="Gửi (Enter)">
          <svg class="icon"><use href="#icon-send"></use></svg>
        </button>
      </div>

      <div class="popover emoji-panel" id="emojiPanel" hidden></div>
      <div class="popover menu" id="menuPanel" hidden></div>
    </div>
  </main>

  <aside class="side-panel" id="sidePanel" hidden>
    <div class="side-panel__head">
      <span id="sidePanelTitle">Thành viên</span>
      <button class="btn-icon" id="btnClosePanel" title="Đóng">
        <svg class="icon icon--sm"><use href="#icon-close"></use></svg>
      </button>
    </div>
    <div class="side-panel__section" id="searchForm" hidden>
      <input type="search" class="field__input" id="roomSearchInput"
             placeholder="Tìm tin nhắn…" autocomplete="off">
    </div>
    <div class="side-panel__body" id="sidePanelBody"></div>
  </aside>
</div>

<div class="toast-stack" id="toastStack"></div>
<div class="modal-backdrop" id="modalRoot" hidden></div>

<script src="{% static 'js/app.js' %}?v={{ asset_version }}" defer></script>
<script src="{% static 'js/atmosphere.js' %}?v={{ asset_version }}" defer></script>
<script src="{% static 'js/ws.js' %}?v={{ asset_version }}" defer></script>
<script src="{% static 'js/chat.js' %}?v={{ asset_version }}" defer></script>
<script src="{% static 'js/rooms.js' %}?v={{ asset_version }}" defer></script>
</body>
</html>
